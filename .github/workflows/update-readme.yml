name: Update README Activity

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:       # Manual trigger
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all commits for accurate activity

      - name: Generate Activity Summary
        id: activity
        run: |
          # Get recent commits (last 6)
          COMMITS=$(git log --oneline --all -6 | awk '{
            msg=$0
            gsub(/^[a-f0-9]+ /, "", msg)
            printf "- `%s`\n", msg
          }')

          # Get recent merged PRs (from commit messages or GitHub API if available)
          # For now, using commit-based approximation
          RECENT=$(echo "$COMMITS" | head -3)

          # Build the activity section (escape for YAML)
          ACTIVITY="Recent Activity:\n${RECENT}"
          
          echo "activity<<EOF" >> $GITHUB_OUTPUT
          echo -e "$ACTIVITY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Update README
        env:
          ACTIVITY: ${{ steps.activity.outputs.activity }}
        run: |
          # Read current README
          CONTENT=$(cat README.md)
          
          # Create temp file with updated activity section
          awk '
            BEGIN { in_section = 0; output = "" }
            /<!--START_SECTION:activity-->/ { 
              in_section = 1
              print $0
              printf "%s\n", ENVIRON["ACTIVITY"]
              next
            }
            /<!--END_SECTION:activity-->/ { 
              print $0
              in_section = 0
              next
            }
            !in_section { print $0 }
          ' README.md > README.md.tmp
          
          mv README.md.tmp README.md

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "chore: update README activity [skip ci]"
            git push
          fi
