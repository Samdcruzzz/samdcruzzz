<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Light background -->
    <radialGradient id="orbitBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </radialGradient>

    <!-- Text gradient (vibrant for light bg) -->
    <linearGradient id="skillGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="skillGlow">
      <feGaussianBlur stdDeviation="2"/>
      <feOffset result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="offsetblur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes spin-cw {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes spin-ccw {
        0% { transform: rotate(360deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes float-in-out {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 1; }
      }
      .ring-outer { 
        animation: spin-cw 20s linear infinite;
        transform-origin: 250px 250px;
      }
      .ring-middle {
        animation: spin-ccw 15s linear infinite;
        transform-origin: 250px 250px;
      }
      .ring-inner {
        animation: spin-cw 12s linear infinite;
        transform-origin: 250px 250px;
      }
      .skill-badge {
        animation: float-in-out 3s ease-in-out infinite;
      }
      .core-circle { animation: float-in-out 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <circle cx="250" cy="250" r="250" fill="url(#orbitBg)"/>

  <!-- OUTER RING (Web & Software) - 20s rotation -->
  <g class="ring-outer">
    <!-- Orbit path (subtle) -->
    <circle cx="250" cy="250" r="200" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.2"/>
    
    <!-- Skills at cardinal points -->
    <circle cx="250" cy="50" r="30" fill="#ddd6fe" opacity="0.7" filter="url(#skillGlow)"/>
    <text x="250" y="58" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5b21b6">React</text>

    <circle cx="450" cy="250" r="30" fill="#ddd6fe" opacity="0.7" filter="url(#skillGlow)"/>
    <text x="450" y="258" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5b21b6">Node.js</text>

    <circle cx="250" cy="450" r="30" fill="#ddd6fe" opacity="0.7" filter="url(#skillGlow)"/>
    <text x="250" y="458" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5b21b6">Python</text>

    <circle cx="50" cy="250" r="30" fill="#ddd6fe" opacity="0.7" filter="url(#skillGlow)"/>
    <text x="50" y="258" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#5b21b6">TypeScript</text>
  </g>

  <!-- MIDDLE RING (Embedded) - 15s counter-rotation -->
  <g class="ring-middle">
    <!-- Orbit path -->
    <circle cx="250" cy="250" r="140" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.25"/>
    
    <!-- Diagonal skills -->
    <circle cx="349" cy="99" r="26" fill="#e9d5ff" opacity="0.75" filter="url(#skillGlow)"/>
    <text x="349" y="106" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#6b21a8">STM32H7</text>

    <circle cx="401" cy="401" r="26" fill="#e9d5ff" opacity="0.75" filter="url(#skillGlow)"/>
    <text x="401" y="408" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#6b21a8">FreeRTOS</text>

    <circle cx="99" cy="401" r="26" fill="#e9d5ff" opacity="0.75" filter="url(#skillGlow)"/>
    <text x="99" y="408" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#6b21a8">C/C++</text>

    <circle cx="99" cy="99" r="26" fill="#e9d5ff" opacity="0.75" filter="url(#skillGlow)"/>
    <text x="99" y="106" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#6b21a8">Arduino</text>
  </g>

  <!-- INNER RING (Protocols) - 12s rotation -->
  <g class="ring-inner">
    <!-- Orbit path -->
    <circle cx="250" cy="250" r="80" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.25"/>
    
    <!-- Key protocols -->
    <circle cx="250" cy="170" r="20" fill="#fbcfe8" opacity="0.8" filter="url(#skillGlow)"/>
    <text x="250" y="176" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#9d174d">SPI</text>

    <circle cx="330" cy="250" r="20" fill="#fbcfe8" opacity="0.8" filter="url(#skillGlow)"/>
    <text x="330" y="256" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#9d174d">I2C</text>

    <circle cx="250" cy="330" r="20" fill="#fbcfe8" opacity="0.8" filter="url(#skillGlow)"/>
    <text x="250" y="336" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#9d174d">UART</text>

    <circle cx="170" cy="250" r="20" fill="#fbcfe8" opacity="0.8" filter="url(#skillGlow)"/>
    <text x="170" y="256" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle" fill="#9d174d">CAN</text>
  </g>

  <!-- CORE (pulsing) -->
  <g class="core-circle">
    <circle cx="250" cy="250" r="35" fill="#c084fc" opacity="0.2" filter="url(#skillGlow)"/>
    <circle cx="250" cy="250" r="28" fill="none" stroke="#9333ea" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- Center title -->
  <text 
    x="250" 
    y="260" 
    font-family="'Segoe UI', 'Courier New', monospace" 
    font-size="16" 
    font-weight="700"
    text-anchor="middle" 
    fill="url(#skillGradient)"
  >Samuel</text>

  <!-- Bottom label -->
  <text 
    x="250" 
    y="485" 
    font-family="'Segoe UI', sans-serif" 
    font-size="12" 
    text-anchor="middle" 
    fill="#7c3aed"
    opacity="0.8"
  >Skills & Expertise</text>
</svg>
