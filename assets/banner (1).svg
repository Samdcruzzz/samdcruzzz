<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Dark background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>

    <!-- Bright cyan -> purple -> pink text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#c026d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>

    <!-- Butterfly wing gradient -->
    <linearGradient id="wingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f43f5e;stop-opacity:1" />
    </linearGradient>

    <!-- Accent glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle animation -->
    <style>
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(4deg); }
      }
      .floating {
        animation: float 3s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bgGradient)"/>

  <!-- Accent lines -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
  <line x1="0" y1="220" x2="1200" y2="220" stroke="#f43f5e" stroke-width="2" opacity="0.5"/>

  <!-- Left accent circle (blurred) -->
  <circle cx="80" cy="150" r="120" fill="#c026d3" opacity="0.2" filter="url(#glow)"/>

  <!-- Right accent circle (blurred) -->
  <circle cx="1120" cy="150" r="100" fill="#22d3ee" opacity="0.18" filter="url(#glow)"/>

  <!-- Butterfly perched on the "S" -->
  <g class="floating" transform="translate(283,42) scale(1.5)">
    <ellipse cx="-11" cy="-9" rx="14" ry="10" fill="url(#wingGradient)" opacity="0.95" transform="rotate(-25 -11 -9)"/>
    <ellipse cx="-8" cy="9" rx="10" ry="7" fill="url(#wingGradient)" opacity="0.85" transform="rotate(-15 -8 9)"/>
    <ellipse cx="11" cy="-9" rx="14" ry="10" fill="url(#wingGradient)" opacity="0.95" transform="rotate(25 11 -9)"/>
    <ellipse cx="8" cy="9" rx="10" ry="7" fill="url(#wingGradient)" opacity="0.85" transform="rotate(15 8 9)"/>
    <ellipse cx="0" cy="0" rx="2.2" ry="15" fill="#facc15"/>
    <line x1="0" y1="-13" x2="-6" y2="-21" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="-13" x2="6" y2="-21" stroke="#facc15" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="-6" cy="-21" r="1.6" fill="#facc15"/>
    <circle cx="6" cy="-21" r="1.6" fill="#facc15"/>
  </g>

  <!-- Main title -->
  <text
    x="600"
    y="120"
    font-family="'Segoe UI', 'Helvetica Neue', sans-serif"
    font-size="72"
    font-weight="700"
    text-anchor="middle"
    fill="url(#textGradient)"
    letter-spacing="-2"
  >Samuel Joshua J</text>

  <!-- Subtitle -->
  <text
    x="600"
    y="185"
    font-family="'Segoe UI', 'Helvetica Neue', sans-serif"
    font-size="28"
    text-anchor="middle"
    fill="#5eead4"
    opacity="0.95"
  >⚡ Embedded Systems Engineer • Full-Stack Builder</text>

  <!-- Bottom accent badge area (for achievements) -->
  <rect x="350" y="245" width="500" height="40" rx="8" fill="#c026d3" opacity="0.2" stroke="#22d3ee" stroke-width="1.2"/>
  <text
    x="600"
    y="272"
    font-family="'Courier New', monospace"
    font-size="14"
    text-anchor="middle"
    fill="#fde68a"
    opacity="0.9"
  >Final-year ECE @ Velammal • CubeSat ADCS Firmware • Hackathon Winner</text>
</svg>
